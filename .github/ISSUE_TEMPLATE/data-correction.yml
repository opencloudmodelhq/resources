---
name: Data correction
description: A published value is wrong or missing.
labels: ["kind:data"]
body:
  - type: input
    id: record
    attributes:
      label: Record
      placeholder: aws us-east-1
    validations:
      required: true
  - type: input
    id: value
    attributes:
      label: Correct value (city level, no street address)
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Public primary source (URL)
      description: No NDA, login-gated, paywalled, scraped or leaked material.
    validations:
      required: true
  - type: textarea
    id: quote
    attributes:
      label: Exact quote from the source
    validations:
      required: true
